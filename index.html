<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f5f1"><title>форма — тренировки под тебя</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--paper:#f6f5f1;--ink:#20241e;--muted:#74796f;--line:#e6e6de;--green:#c8ef69;--dark:#263126;--white:#fff;--orange:#f29a69;--shadow:0 14px 40px #2933250d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.serif{font-family:'Manrope',sans-serif;letter-spacing:-.055em;font-weight:700}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100% - 1240px)/2),28px);border-bottom:1px solid var(--line)}.brand{font:800 25px Manrope;letter-spacing:-1.6px}.brand span{color:#779d37}.nav{display:flex;gap:30px;color:var(--muted);font-size:14px}.nav a{color:inherit;text-decoration:none}.top-actions{display:flex;gap:10px}.btn{padding:12px 19px;border-radius:999px;font-weight:700;background:var(--green);color:var(--ink);transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(.97)}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.dark{background:var(--dark);color:white}.btn.small{padding:10px 15px;font-size:13px}.hero{max-width:1240px;margin:auto;padding:74px 28px 54px;display:grid;grid-template-columns:1.02fr .98fr;gap:62px;align-items:center}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:#66853a;font-weight:700}.hero h1{font:700 clamp(48px,6.2vw,82px)/.99 Manrope;letter-spacing:-.075em;margin:18px 0 20px;max-width:650px}.hero h1 em{font-style:normal;color:#829f4d}.hero p{font-size:17px;line-height:1.7;color:var(--muted);max-width:490px;margin:0 0 27px}.hero-buttons{display:flex;gap:12px;align-items:center}.hero-note{font-size:12px;color:var(--muted);margin…2160 tokens truncated… отличный старт</span></div><div class="float-card two"><span>ЭТА НЕДЕЛЯ</span><b>02 / 03</b><span>тренировки завершено</span></div></div></section><section class="section" id="how"><div class="section-head"><div><div class="eyebrow">ПРОСТО НАЧАТЬ</div><h2>Твой путь — три шага</h2></div></div><div class="features" id="features"><article class="feature"><div class="icon">✳️</div><h3>Расскажи о себе</h3><p>Цель, опыт, предпочтения, доступное оборудование и важные ограничения — учтём твой старт.</p></article><article class="feature"><div class="icon">↗️</div><h3>Получи свой план</h3><p>Подборка занятий с подходящей частотой и понятным описанием каждого упражнения.</p></article><article class="feature"><div class="icon">◷</div><h3>Отмечай прогресс</h3><p>Тренировки, вода и шаги — привычки на виду, чтобы замечать свой прогресс каждый день.</p></article></div></section><footer class="footer"><span>форма. · Тренируйся в своём ритме</span><span>Тренировки не заменяют консультацию специалиста</span></footer></main>
<main class="app" id="app"></main>
<div class="modal-wrap" id="modal"><div class="modal"><div class="modal-top"><h2 id="modalTitle">Создать аккаунт</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s);let profile=JSON.parse(localStorage.getItem('formaProfile')||'null'),form={},step=0,authMode='register',selectedGoal='',selectedPrefs=[];
function saveProfile(){localStorage.setItem('formaProfile',JSON.stringify(profile))}function openAuth(mode){authMode=mode;form={};step=0;$('#modal').style.display='flex';renderModal()}function closeModal(){$('#modal').style.display='none'}
function renderModal(){if(authMode==='login'){ $('#modalTitle').textContent='С возвращением';$('#modalBody').innerHTML=`<div class="field"><label>Электронная почта</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input id="password" type="password" placeholder="Не менее 6 символов"></div><button class="btn" style="width:100%" onclick="login()">Войти в аккаунт</button><div class="auth-switch">Нет аккаунта? <button onclick="openAuth('register')">Зарегистрироваться</button></div>`;return}
 if(step===0){$('#modalTitle').textContent='Создать аккаунт';$('#modalBody').innerHTML=`<div class="field"><label>Как тебя зовут?</label><input id="name" placeholder="Имя"></div><div class="field"><label>Электронная почта</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Придумай пароль</label><input id="password" type="password" placeholder="Не менее 6 символов"></div><button class="btn" style="width:100%" onclick="registerNext()">Продолжить →</button><div class="auth-switch">Уже есть аккаунт? <button onclick="openAuth('login')">Войти</button></div><p class="notice">Демо-версия: аккаунт хранится только в этом браузере.</p>`;return}
 const content=step===1?`<div class="field"><label>Какой результат тебе важнее?</label><div class="choices">${['Стать сильнее','Больше энергии','Поддерживать форму','Улучшить выносливость','Больше двигаться'].map(x=>`<button class="choice ${selectedGoal===x?'selected':''}" onclick="selectedGoal='${x}';renderModal()">${x}</button>`).join('')}</div></div><div class="field"><label>Какой у тебя опыт?</label><select id="level"><option>Начинаю с нуля</option><option>Иногда тренируюсь</option><option>Тренируюсь регулярно</option></select></div><div class="field"><label>Где удобнее заниматься?</label><select id="place"><option>Дома, без оборудования</option><option>Дома, есть инвентарь</option><option>В тренажёрном зале</option><option>На улице</option></select></div>`:step===2?`<div class="grid2"><div class="field"><label>Возраст</label><input id="age" type="number" min="14" max="100" placeholder="Например, 28"></div><div class="field"><label>Сколько занятий в неделю?</label><select id="frequency"><option value="2">2 раза</option><option value="3" selected>3 раза</option><option value="4">4 раза</option><option value="5">5 раз</option></select></div><div class="field"><label>Рост (см)</label><input id="height" type="number" placeholder="170"></div><div class="field"><label>Вес (кг)</label><input id="weight" type="number" placeholder="65"></div></div><div class="field"><label>Есть травмы, ограничения или пожелания?</label><input id="limits" placeholder="Например: избегать прыжков"></div><p class="notice">Рост и вес необязательны — они не используются для медицинских выводов. Если есть боль, заболевание или сомнения, обсуди нагрузку со специалистом.</p>`:`<div class="field"><label>Что тебе нравится?</label><div class="choices">${['Силовые','Растяжка','Кардио','Йога','Короткие тренировки'].map(x=>`<button class="choice ${selectedPrefs.includes(x)?'selected':''}" onclick="togglePref('${x}')">${x}</button>`).join('')}</div></div><div class="field"><label>Твоя дневная цель по воде</label><select id="waterGoal"><option value="1500">1,5 литра</option><option value="2000" selected>2 литра</option><option value="2500">2,5 литра</option></select></div><div class="field"><label>Цель по шагам</label><select id="stepGoal"><option value="6000">6 000 шагов</option><option value="8000" selected>8 000 шагов</option><option value="10000">10 000 шагов</option></select></div><p class="notice">Цели по воде и шагам можно изменить позже. Пей по жажде и учитывай рекомендации врача, если они у тебя есть.</p>`;
 $('#modalTitle').textContent=['','Твоя цель','Твой режим','Твои привычки'][step];$('#modalBody').innerHTML=`<div class="steps">${[1,2,3].map(n=>`<i class="${n<=step?'active':''}"></i>`).join('')}</div>${content}<div class="modal-actions"><button class="btn ghost" onclick="step--;renderModal()">${step===1?'Назад':'Назад'}</button><button class="btn" onclick="nextStep()">${step===3?'Создать мой план':'Дальше →'}</button></div>`;}
async function registerNext(){const name=$('#name').value.trim(),email=$('#email').value.trim(),password=$('#password').value;if(!name||!email.includes('@')||password.length<8){alert('Укажи имя, корректную почту и пароль от 8 символов.');return}try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password})}),d=await r.json();if(!r.ok)throw Error(d.error);form={name,email};step=1;renderModal()}catch(e){alert(e.message||'Не удалось создать аккаунт')}}
function togglePref(x){selectedPrefs=selectedPrefs.includes(x)?selectedPrefs.filter(y=>y!==x):[...selectedPrefs,x];renderModal()}
async function nextStep(){if(step===1){if(!selectedGoal){alert('Выбери главную цель.');return}form.goal=selectedGoal;form.level=$('#level').value;form.place=$('#place').value}if(step===2){form.age=$('#age').value;form.frequency=Number($('#frequency').value);form.height=$('#height').value;form.weight=$('#weight').value;form.limits=$('#limits').value}if(step===3){form.prefs=selectedPrefs;form.waterGoal=Number($('#waterGoal').value);form.stepGoal=Number($('#stepGoal').value);profile={...form,tracker:{date:new Date().toLocaleDateString('sv-SE'),water:0,steps:0,done:[]}};try{const r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(profile)}),d=await r.json();if(!r.ok)throw Error(d.error);profile.plan=d.plan.sessions[0].exercises.map(x=>({name:x.name,meta:`${x.sets} подхода × ${x.repetitions}`,desc:x.instructions}));saveProfile();closeModal();showApp()}catch(e){alert(e.message||'Не удалось сохранить анкету')}return}step++;renderModal()}
async function login(){const email=$('#email').value.trim(),password=$('#password').value;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.error);const pr=await fetch('/api/profile'),pd=await pr.json();if(!pd.profile){alert('Аккаунт найден. Заверши анкету регистрации, чтобы открыть план.');return}const row=pd.profile;profile={...row,name:d.user.name,email:d.user.email,goal:row.goal,waterGoal:2000,stepGoal:8000,plan:pd.plan.sessions[0].exercises,tracker:{date:new Date().toLocaleDateString('sv-SE'),water:0,steps:0,done:[]}};closeModal();showApp()}catch(e){alert(e.message||'Не удалось войти')}}
async function logout(){fetch('/api/logout',{method:'POST'});profile=null;localStorage.removeItem('formaProfile');$('#app').style.display='none';$('#landing').style.display='block';$('.top-actions').innerHTML=`<button class="btn ghost small" onclick="openAuth('login')">Войти</button><button class="btn small" onclick="openAuth('register')">Начать бесплатно ↗</button>`}
function refreshDay(){const today=new Date().toLocaleDateString('sv-SE');if(profile.tracker.date!==today)profile.tracker={date:today,water:0,steps:0,done:[]}}
function weekPlan(){if(profile.plan)return profile.plan;let prefs=profile.prefs||[],goal=profile.goal||'';let base=[{name:'Приседания к стулу',meta:'3 подхода × 10 повторений',desc:'Поставь стопы примерно на ширине плеч. Отведи таз назад и опускайся до касания стула, сохраняя спину ровной. Поднимись, отталкиваясь всей стопой. Двигайся без боли.'},{name:'Отжимания от стены',meta:'3 × 8–12 повторений',desc:'Встань на расстоянии вытянутых рук от стены, ладони чуть шире плеч. Согни локти и приблизь грудь к стене, удерживая корпус прямым. Выдохни и вернись.'},{name:'Ягодичный мост',meta:'3 × 12 повторений',desc:'Ляг на спину, согни ноги, стопы поставь на пол. Напряги ягодицы и подними таз до прямой линии от плеч до колен. Задержись на секунду и опустись.'},{name:'«Птица-собака»',meta:'2 × 8 на сторону',desc:'Встань на четвереньки. Одновременно вытягивай противоположные руку и ногу, не прогибая поясницу. Вернись и повтори на другую сторону.'}];if(prefs.includes('Кардио'))base[3]={name:'Марш на месте',meta:'3 × 45 секунд',desc:'Маршируй на месте в комфортном темпе, мягко ставь стопу и двигай руками. Остановись, если почувствуешь боль или необычное головокружение.'};return base}
function showApp(){refreshDay();saveProfile();$('#landing').style.display='none';$('#app').style.display='block';$('.top-actions').innerHTML=`<button class="btn ghost small" onclick="logout()">Выйти</button>`;renderApp();window.scrollTo(0,0)}
function renderApp(){let t=profile.tracker,waterPct=Math.min(100,Math.round(t.water/profile.waterGoal*100)),stepPct=Math.min(100,Math.round(t.steps/profile.stepGoal*100)),done=t.done.length,plan=weekPlan();$('#app').innerHTML=`<div class="app-head"><div><div class="eyebrow">ТВОЯ ПЕРСОНАЛЬНАЯ ПРОГРАММА</div><h1>Привет, ${escapeHTML(profile.name)} 👋</h1></div><button class="btn ghost small" onclick="resetProfile()">Изменить анкету</button></div><div class="dashboard"><section class="welcome"><div><h2>Твой прогресс начинается сегодня</h2><p>${escapeHTML(profile.goal)} · ${profile.frequency} тренировки в неделю · ${escapeHTML(profile.place)}</p></div><span class="badge">${done} из ${plan.length} упражнений сегодня</span></section><section class="panel"><div class="panel-title"><h2>Твои привычки</h2><small>Сегодня</small></div><div class="habit"><div class="habit-icon">💧</div><div class="habit-info"><b>Водный баланс</b><small>${t.water} мл из ${profile.waterGoal} мл</small><div class="progress"><i style="width:${waterPct}%"></i></div></div><div class="counter"><button onclick="adjust('water',-250)">−</button><strong>${(t.water/1000).toFixed(2)} л</strong><button onclick="adjust('water',250)">+</button></div></div><div class="habit"><div class="habit-icon">👟</div><div class="habit-info"><b>Шаги</b><small>${t.steps.toLocaleString('ru-RU')} из ${profile.stepGoal.toLocaleString('ru-RU')}</small><div class="progress"><i style="width:${stepPct}%"></i></div></div><div class="counter"><button onclick="adjust('steps',-500)">−</button><strong>${t.steps.toLocaleString('ru-RU')}</strong><button onclick="adjust('steps',500)">+</button></div></div><div class="habit"><div class="habit-icon">🏋️</div><div class="habit-info"><b>Тренировка</b><small>${done?`Отмечено упражнений: ${done}`:'Отмечай упражнения по мере выполнения'}</small></div><span class="badge">${done?'В деле':'План'}</span></div></section><aside class="panel"><div class="panel-title"><h2>Твой профиль</h2><small>настроено под тебя</small></div><div class="metrics"><div class="metric"><span>Цель</span><b style="font-size:15px">${escapeHTML(profile.goal)}</b></div><div class="metric"><span>Опыт</span><b style="font-size:14px">${escapeHTML(profile.level)}</b></div><div class="metric"><span>В неделю</span><b>${profile.frequency}×</b></div></div><p class="tiny" style="margin-top:16px">Предпочтения: ${escapeHTML((profile.prefs||[]).join(', ')||'подойдут разные форматы')}</p>${profile.limits?`<p class="tiny">Учитываем: ${escapeHTML(profile.limits)}</p>`:''}</aside><section class="panel workout"><div class="panel-title"><div><h2>Тренировка на сегодня</h2><small>Разомнись 5 минут · отдыхай 60–90 секунд между подходами</small></div><span class="badge">около 25 минут</span></div><div class="day-tabs"><button class="day-tab active">День A · Всё тело</button><button class="day-tab" onclick="alert('Следующие занятия будут чередоваться: День B — лёгкое кардио и подвижность. Сегодня начни с первого дня программы.')">День B · Движение</button><button class="day-tab" onclick="alert('День отдыха: прогулка или мягкая растяжка по самочувствию.')">День отдыха</button></div>${plan.map((e,i)=>`<div class="exercise"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h3>${e.name}</h3><p>${e.desc}</p></div><div><div class="exercise-meta">${e.meta}</div><button class="done-btn ${t.done.includes(i)?'checked':''}" onclick="toggleDone(${i})">${t.done.includes(i)?'✓ Готово':'Отметить'}</button></div></div>`).join('')}<p class="notice">Начни с комфортного темпа и прекращай упражнение при боли, слабости или головокружении. Программа носит информационный характер и не заменяет консультацию врача или тренера.</p></section></div>`}
function adjust(k,n){profile.tracker[k]=Math.max(0,profile.tracker[k]+n);saveProfile();renderApp()}function toggleDone(i){let a=profile.tracker.done;profile.tracker.done=a.includes(i)?a.filter(x=>x!==i):[...a,i];saveProfile();renderApp()}function resetProfile(){if(confirm('Создать новую анкету? Текущие отметки трекера будут сброшены.')){profile=null;localStorage.removeItem('formaProfile');$('.top-actions').innerHTML=`<button class="btn ghost small" onclick="openAuth('login')">Войти</button><button class="btn small" onclick="openAuth('register')">Начать бесплатно ↗</button>`;$('#app').style.display='none';$('#landing').style.display='block';openAuth('register')}}function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(profile){refreshDay();showApp()}
</script></body></html>
